[project]
name = "qutrub-worker"
version = "0.1.0"
description = "Live Arabic verb conjugation via libqutrub for the arabic-trainer 'Спряжение' feature"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "libqutrub",
    "pyarabic",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
